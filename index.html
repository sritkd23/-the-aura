<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Aura Atelier | Gifts Made With Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-cream: #FFFDF9;
      --bg-soft-purple: #F3EAF8;
      --hero-purple: #EADAFA;
      --text-dark: #2B1638;
      --purple-primary: #3C1661;
      --purple-hover: #290D45;
      --purple-light: #F8EDFF;
      --border-color: #EADAF2;
      --accent-pink: #D070B8;
      --whatsapp-green: #25D366;
      --shadow-sm: 0 4px 15px rgba(60, 22, 97, 0.05);
      --shadow-md: 0 8px 25px rgba(60, 22, 97, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --admin-gold: #D4AF37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { max-width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* Admin Banner */
    .admin-indicator {
      display: none;
      background: #222;
      color: var(--admin-gold);
      text-align: center;
      padding: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    body.admin-mode .admin-indicator { display: block; }
    body.admin-mode .admin-only { display: inline-flex !important; }
    .admin-only { display: none !important; }

    /* Top Announcement Bar */
    .announcement-bar {
      background-color: #FAF4FD;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 5%;
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--purple-primary);
    }

    .announcement-left, .announcement-right { display: flex; align-items: center; gap: 20px; }
    .announcement-item { display: flex; align-items: center; gap: 6px; }
    .social-links { display: flex; gap: 12px; }
    .social-links a { color: var(--purple-primary); text-decoration: none; font-size: 0.9rem; }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5%;
      background: var(--bg-cream);
      position: relative;
    }

    .brand-logo { text-decoration: none; color: var(--purple-primary); cursor: pointer; user-select: none; }
    .brand-logo h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .brand-logo span { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-top: 4px; color: #6C547B; }

    .nav-menu { display: flex; gap: 24px; list-style: none; align-items: center; }
    .nav-item { position: relative; }
    .nav-link { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.92rem; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .nav-link:hover, .nav-link.active { color: var(--purple-primary); font-weight: 600; }

    /* Dropdown Styles */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      min-width: 200px;
      display: none;
      flex-direction: column;
      z-index: 120;
      padding: 8px 0;
    }
    .nav-item:hover .dropdown { display: flex; }
    .dropdown-item {
      padding: 8px 16px;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-item:hover { background: var(--purple-light); color: var(--purple-primary); }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--purple-primary);
      cursor: pointer;
      padding: 6px;
    }

    .nav-actions { display: flex; gap: 12px; align-items: center; }
    .btn-pill {
      background: var(--purple-light);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--purple-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .badge {
      background: var(--purple-primary);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #F5EBFA 0%, #E8D4F5 100%);
      border-radius: var(--radius-lg);
      padding: 40px 60px;
      margin: 10px 0 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      position: relative;
      min-height: 380px;
    }

    .hero-subtitle { font-size: 0.8rem; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; color: var(--purple-primary); margin-bottom: 12px; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; color: var(--purple-primary); margin-bottom: 12px; line-height: 1.1; }
    .hero-desc { color: #553E63; font-size: 0.98rem; max-width: 380px; margin-bottom: 28px; }
    .hero-buttons { display: flex; gap: 14px; }

    .btn-primary {
      background: var(--purple-primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(60, 22, 97, 0.2);
    }
    .btn-primary:hover { background: var(--purple-hover); }

    .btn-outline {
      background: transparent;
      color: var(--purple-primary);
      border: 1.5px solid var(--purple-primary);
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .hero-img-box {
      width: 100%;
      max-width: 480px;
      height: 320px;
      background-size: cover;
      background-position: center;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    /* Categories Horizontal Grid */
    .categories-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 40px; }
    .category-card {
      background: #FAFAF8;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-dark);
      cursor: pointer;
    }
    .category-card:hover { border-color: var(--purple-primary); background: white; }

    /* Section Styling */
    .page-section { display: none; }
    .page-section.active { display: block; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: var(--purple-primary); }

    /* Product Grid */
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 40px; }
    .product-card {
      background: #FAF8FC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      position: relative;
      align-items: center;
    }

    .product-img-container { width: 100%; height: 180px; border-radius: var(--radius-md); overflow: hidden; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .product-price { font-size: 1.1rem; font-weight: 700; color: var(--purple-primary); margin-bottom: 8px; }
    .product-desc { font-size: 0.85rem; color: #6C547B; margin-bottom: 14px; }

    .wishlist-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #888;
    }
    .wishlist-btn.active { color: #E63946; }

    .delete-prod-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* Modal / Drawer Overlay */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 200; display: none;
    }
    .overlay.active { display: block; }

    .side-drawer {
      position: fixed; top: 0; right: -420px; width: 400px; height: 100%;
      background: white; z-index: 201; transition: right 0.3s ease;
      padding: 24px; display: flex; flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,0.1);
    }
    .side-drawer.active { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .drawer-content { flex: 1; overflow-y: auto; }
    .drawer-footer { border-top: 1px solid var(--border-color); padding-top: 16px; margin-top: 10px; }

    .item-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; }
    .item-row img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .item-details { flex: 1; }
    .remove-btn { color: #ff4d4d; cursor: pointer; font-size: 0.85rem; border: none; background: none; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.88rem;
    }

    /* Features Strip */
    .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
    .feature-box { background: #FDF9FE; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; gap: 14px; }
    .feature-icon { width: 44px; height: 44px; background: var(--purple-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--purple-primary); }

    /* Floating Navigation Elements */
    .side-nav {
      position: fixed; right: 0; top: 50%; transform: translateY(-50%);
      background: var(--purple-primary); border-radius: 16px 0 0 16px; padding: 12px 8px;
      display: flex; flex-direction: column; gap: 16px; z-index: 100;
    }
    .side-nav-item { color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 4px; position: relative; cursor: pointer; }
    .side-badge { position: absolute; top: -4px; right: 2px; background: white; color: var(--purple-primary); font-size: 0.65rem; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .whatsapp-btn {
      position: fixed; bottom: 24px; right: 24px; background: var(--whatsapp-green); color: white;
      width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); text-decoration: none; z-index: 99;
    }

    /* Empty Placeholder */
    .empty-msg { text-align: center; padding: 40px; color: #888; font-style: italic; }

    /* Reviews Section */
    .reviews-section { margin-top: 44px; }
    .reviews-summary {
      display: flex; align-items: center; gap: 20px; background: #FDF9FE;
      border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 24px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .reviews-avg-score { font-family: 'Playfair Display', serif; font-size: 2.6rem; color: var(--purple-primary); line-height: 1; }
    .reviews-avg-stars { color: #F5A623; font-size: 1.1rem; margin: 6px 0 4px; }
    .reviews-avg-count { font-size: 0.82rem; color: #6C547B; }
    .reviews-summary-divider { width: 1px; align-self: stretch; background: var(--border-color); }
    .reviews-summary-actions { flex: 1; display: flex; justify-content: flex-end; }

    .reviews-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 8px; }
    .review-card {
      background: #FAF8FC; border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 18px;
    }
    .review-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .review-author { font-weight: 700; font-size: 0.95rem; }
    .review-date { font-size: 0.72rem; color: #999; margin-top: 2px; }
    .review-stars { color: #F5A623; font-size: 0.9rem; margin-bottom: 8px; }
    .review-text { font-size: 0.88rem; color: #553E63; }

    /* Star Rating Input */
    .star-rating-input { display: flex; gap: 6px; font-size: 1.6rem; color: #D8D0DE; margin-bottom: 4px; }
    .star-rating-input i { cursor: pointer; transition: color 0.15s ease; }
    .star-rating-input i.selected { color: #F5A623; }

    /* ===================== Responsiveness ===================== */

    /* Tablet: stack hero, collapse nav into hamburger menu */
    @media (max-width: 992px) {
      .hero-banner { grid-template-columns: 1fr; text-align: center; }
      .hero-buttons { justify-content: center; }
      .hero-img-box { max-width: 100%; margin: 0 auto; }
      .products-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .navbar { flex-wrap: wrap; row-gap: 10px; }
      .mobile-menu-toggle { display: inline-flex; }

      .nav-menu {
        display: none;
        width: 100%;
        order: 3;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        background: white;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 10px;
      }
      .nav-menu.mobile-active { display: flex; }
      .nav-item { width: 100%; position: static; }
      .nav-link { padding: 10px 8px; justify-content: space-between; width: 100%; }
      .dropdown {
        position: static;
        display: none;
        box-shadow: none;
        border: none;
        border-radius: 0;
        margin: 0 0 4px 12px;
        min-width: unset;
        padding: 0;
      }
      .nav-item:hover .dropdown { display: none; }
      .nav-item.mobile-open .dropdown { display: flex; }

      .nav-actions { gap: 8px; }
      .nav-actions .btn-pill { padding: 8px 10px; }
      .nav-actions .btn-pill .btn-label { display: none; }

      .categories-bar { grid-template-columns: repeat(3, 1fr); }
      .features-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Phones */
    @media (max-width: 640px) {
      .container { padding: 0 14px; }

      .announcement-bar { flex-wrap: wrap; gap: 6px; font-size: 0.7rem; padding: 8px 4%; }
      .announcement-left { display: none; }
      .announcement-right { width: 100%; justify-content: space-between; }

      .hero-banner { padding: 28px 20px; min-height: unset; border-radius: var(--radius-md); }
      .hero-title { font-size: 2rem; }
      .hero-desc { max-width: 100%; }
      .hero-buttons { flex-direction: column; gap: 10px; }
      .hero-buttons .btn-primary, .hero-buttons .btn-outline { width: 100%; text-align: center; }
      .hero-img-box { height: 220px; margin-top: 20px; }

      .categories-bar { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 28px; }
      .category-card { padding: 12px 8px; font-size: 0.82rem; }

      .section-title { font-size: 1.35rem; }
      .section-header { flex-wrap: wrap; gap: 10px; }

      .products-grid { gap: 16px; }
      .product-card { grid-template-columns: 1fr; padding: 14px; }
      .product-img-container { height: 200px; }
      .wishlist-btn { top: 24px; right: 24px; }
      .delete-prod-btn { bottom: 24px; right: 24px; }

      .features-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .feature-box { padding: 12px; gap: 10px; }
      .feature-box h4 { font-size: 0.85rem; }
      .feature-box p { font-size: 0.75rem; }

      .reviews-grid { grid-template-columns: 1fr; }
      .reviews-summary { flex-direction: column; align-items: flex-start; gap: 12px; }
      .reviews-summary-divider { display: none; }
      .reviews-summary-actions { width: 100%; justify-content: flex-start; }
      .reviews-summary-actions .btn-primary { width: 100%; text-align: center; justify-content: center; }

      /* Drawers/modals take the full screen on phones */
      .side-drawer { width: 100% !important; right: -100%; padding: 18px; }
      .side-drawer.active { right: 0; }

      /* Hide the floating side-nav on mobile; header icons + WhatsApp bubble already cover it */
      .side-nav { display: none; }

      .whatsapp-btn { width: 48px; height: 48px; font-size: 1.5rem; bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

  <!-- Admin Active Banner -->
  <div class="admin-indicator">
    <i class="fa-solid fa-user-shield"></i> ADMIN MODE ACTIVE — Click "The Aura" logo 5 times to exit.
  </div>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <div class="announcement-left">
      <span class="announcement-item"><i class="fa-regular fa-heart"></i> Handmade with love</span>
      <span class="announcement-item"><i class="fa-solid fa-gift"></i> Premium Quality</span>
      <span class="announcement-item"><i class="fa-solid fa-truck"></i> Delivery Across India</span>
    </div>
    <div class="announcement-right">
      <span>Follow us</span>
      <div class="social-links">
        <a href="https://instagram.com/_the.aura.in" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://wa.me/917208718323" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="navbar container">
    <div class="brand-logo" onclick="registerLogoClick()">
      <h1>The Aura</h1>
      <span>ATELIER • GIFTS MADE WITH LOVE</span>
    </div>

    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-menu" id="nav-menu">
      <li class="nav-item"><a class="nav-link active" onclick="showPage('home'); closeMobileMenu();">Home</a></li>
      <li class="nav-item">
        <a class="nav-link" onclick="showPage('collections'); closeMobileMenu();">Collections <i class="fa-solid fa-chevron-down" style="font-size:0.7rem;"></i></a>
        <div class="dropdown" id="collections-dropdown"></div>
      </li>
      <li class="nav-
